# Los valores se leen del archivo `.env` (copia de `.env.example`). Si no existe,
# se usan los defaults de desarrollo definidos con la sintaxis ${VAR:-default}.

services:
  flask_app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    environment:
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-facturas_dian}
      SCRAPER_HEADLESS: ${SCRAPER_HEADLESS:-1}
    depends_on:
      - mysql

  mysql:
    image: mysql:5.7
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-facturas_dian}
    ports:
      - "3306:3306"
